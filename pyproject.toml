[project]
name = "bems-agent"
version = "0.1.0"
description = "Backend service for an enterprise building energy management agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents",
    "deepagents-cli",
    "fastapi>=0.116.0,<1.0.0",
    "greenlet>=3.2.0,<4.0.0",
    "langchain-openai>=1.1.8,<2.0.0",
    "langchain-mcp-adapters>=0.2.0,<1.0.0",
    "langgraph>=1.1.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "prompt_toolkit>=3.0.52,<4.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.scripts]
bems-agent = "bems_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
deepagents = { path = "/Library/WorkSpace Python/deepagents/libs/deepagents", editable = true }
deepagents-cli = { path = "/Library/WorkSpace Python/deepagents/libs/cli", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bems_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]
